@if (totalVotes() > 0) {
  <ul class="results">
    @for (option of options(); track option.id; let index = $index) {
      <li class="result">
        <div class="result__row">
          <b>{{ labelFor(index) }}</b>
          <div class="result__track">
            <span class="result__bar" [style.width.%]="percentage(option)"></span>
          </div>
          <strong>{{ percentage(option) }}%</strong>
        </div>
      </li>
    }
  </ul>
} @else {
  <div class="results-empty">
    <p>Results will be shown here after participants complete the survey.</p>
    <strong>There are no answers yet.</strong>
  </div>
}
