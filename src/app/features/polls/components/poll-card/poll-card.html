<a
  class="survey-card-link"
  [class.survey-card-link--highlight]="highlight()"
  [routerLink]="['/polls', poll().id]"
>
  <article class="survey-card">
    <p class="survey-card__category">{{ poll().category }}</p>
    <h3>{{ poll().title }}</h3>
    <div class="survey-card__footer">
      <p class="survey-card__deadline">{{ deadlineLabel() }}</p>
    </div>
  </article>
</a>
