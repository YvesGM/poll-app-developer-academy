<article>
  <h3>{{ poll().question }}</h3>

  <p>{{ poll().options.length }} options · {{ totalVotes() }} votes</p>
  <p>Created: {{ poll().createdAt | date: 'medium' }}</p>

  <p>
    Status:
    @if (poll().closed) {
      <strong>Closed</strong>
    } @else {
      <strong>Open</strong>
    }
  </p>

  <a [routerLink]="['/polls', poll().id]">Open Poll</a>
</article>
