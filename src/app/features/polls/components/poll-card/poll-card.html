<article>
  <p>{{ poll().category }}</p>
  <h3>{{ poll().title }}</h3>

  <p>{{ poll().options.length }} options · {{ totalVotes() }} votes</p>

  @if (poll().deadline; as deadline) {
    <p>Deadline: {{ deadline | date: 'medium' }}</p>
  } @else {
    <p>Deadline: No deadline</p>
  }

  <a [routerLink]="['/polls', poll().id]">Open Survey</a>
</article>
